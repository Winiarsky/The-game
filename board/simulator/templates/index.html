<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Symulator planszy 15x20</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
    <header>
        <h1>Symulator planszy</h1>
        <p>Kliknij pole aby odpowiedzieć na <code>scan_board</code>. Podświetlenia pokazują wynik <code>set_leds</code>.</p>
        <p><a class="link-secondary" href="/scenario-editor">Przejdź do edytora scenariuszy</a></p>
    </header>

    <section class="status-panel">
        <div id="pending-indicator">Brak aktywnych zapytań scan_board.</div>
        <div id="last-click">Nie zarejestrowano kliknięć.</div>
    </section>

    <section class="mode-toggle">
        <span>Tryb pracy:</span>
        <label>
            <input type="radio" name="board-mode" value="board" checked>
            Plansza (klikanie wywołuje <code>scan_board</code>)
        </label>
        <label>
            <input type="radio" name="board-mode" value="move">
            Przesuwanie figurek (bez wywołań)
        </label>
    </section>

    <section class="background-controls">
        <label class="file-input">
            <span>Ustaw tło planszy:</span>
            <input type="file" id="background-input" accept="image/*">
        </label>
        <button id="background-clear" type="button">Usuń tło</button>
    </section>

    <section class="figures-panel">
        <div class="panel-header">
            <strong>Figurki</strong>
            <button id="add-figure" type="button">Dodaj figurkę</button>
        </div>
        <div id="figures-list" class="figures-list">
            <p class="figures-empty">Brak figurek. Dodaj nową, aby rozpocząć.</p>
        </div>
    </section>

    <section id="board"
             class="board"
             data-rows="{{ rows }}"
             data-cols="{{ cols }}">
    </section>

    <template id="toast-template">
        <div class="toast"></div>
    </template>

    <script>
        window.BOARD_DIMENSIONS = {rows: {{ rows }}, cols: {{ cols }}};
    </script>
    <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
