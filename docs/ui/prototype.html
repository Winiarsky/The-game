.enemy-panel{min-width:0;align-self:start}.enemy-heading{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:10px}.enemy-heading h2{font-size:25px}.enemy-heading span{color:var(--muted);font-size:11px}.enemy-row{display:flex;align-items:center;gap:11px;padding:10px 0;border-top:1px solid var(--line);width:100%;text-align:left}.enemy-row:hover .enemy-name{color:var(--gold)}.enemy-id{display:grid;place-items:center;flex:none;width:30px;height:34px;border:1px solid #d9948444;color:var(--red);border-radius:4px;font:20px var(--serif)}.enemy-info{flex:1;min-width:0}.enemy-top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}.enemy-name{font:17px var(--serif)}.enemy-hp{font-size:12px;white-space:nowrap;color:var(--text)}.health-track{height:3px;margin-top:7px;background:#ffffff0e}.health-track>span{display:block;height:100%;background:#bd7d71}.enemy-row.defeated{opacity:.55}.enemy-row.defeated .health-track{display:none}.defeated-group{border-top:1px solid var(--line);margin-top:3px;font-size:11px;color:var(--muted)}.defeated-group summary{cursor:pointer;padding:9px 0}.defeated-group .enemy-row{padding:7px 0}.enemy-note{font-size:10px;margin-top:5px}
.actor-effects{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}.effect-badge{display:inline-flex;align-items:center;gap:4px;border:1px solid #ffffff18;border-radius:3px;padding:2px 5px;font-size:10px;line-height:1.3;color:var(--muted)}.effect-badge.negative{color:#edb5a8;border-color:#d9948438;background:#d9948409}.effect-badge.aura{color:#c2d6c1;border-color:#b9cdb636;background:#b9cdb60b}.effect-badge.focus{color:var(--gold);border-color:#d6bd8640}.effect-icon{width:12px;height:12px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}.no-effects{font-size:10px;color:var(--muted)}
.combat-mode .party-member{display:block;padding:7px 5px}.combat-member-head{display:flex;align-items:flex-start;gap:8px}.combat-member-head>span{flex:1;min-width:0}.combat-mode .party-member .avatar{width:31px;height:38px}.combat-mode .party-member .party-stats{display:none}.combat-mode .party-member small{font-size:11px;color:var(--text)}.combat-mode .party-member .actor-effects{gap:3px}.combat-mode .party-member .effect-badge{font-size:9px;padding:2px 4px}.combat-mode .party-member .effect-icon{width:10px;height:10px}.combat-mode .party-member .health-track{margin-top:5px}.combat-mode .party-member .health-track>span{background:var(--green)}.combat-mode .party-member>span{flex:1}.combat-mode .party-member.aura-preview{outline:1px solid var(--green);outline-offset:-1px}.combat-mode .party-member.aura-source{outline:2px solid #eee;outline-offset:-2px}.enemy-row.located,.party-member.located{outline:2px solid var(--gold);outline-offset:-2px}
.effect-detail{padding:14px 0;border-top:1px solid var(--line)}.effect-detail h3{margin:0 0 8px!important;font-size:20px!important}.effect-detail p{font-size:13px;margin:7px 0}.effect-detail .effect-source{color:var(--gold);font-size:11px}.actor-detail-health{font:32px var(--serif);margin:12px 0}.actor-detail-health small{font:13px system-ui;color:var(--muted)}.status-summary{margin:14px 0;display:flex;gap:8px;flex-wrap:wrap}
.prototype-feedback{padding:8px 24px;background:#273529;color:#d8e3d4;display:flex;align-items:center;justify-content:center;gap:20px;font-size:11px}.prototype-feedback[hidden]{display:none}.prototype-feedback button{font-size:11px;text-decoration:underline;white-space:nowrap}
@media(min-width:801px) and (max-height:780px){.combat-mode .masthead{height:52px;flex-shrink:0}.combat-mode .initiative-strip{margin-top:9px;padding-bottom:7px}.combat-mode .initiative-actor{height:40px}.combat-mode .initiative-heading{margin-bottom:5px}.combat-mode .enemy-row{padding:6px 0}.combat-mode .enemy-heading{margin-bottom:6px}.combat-mode .play-area{margin-bottom:8px}.combat-mode .action-preview-copy{font-size:16px;margin:12px 0 16px}.combat-mode .action-preview-cost{margin-top:13px}.combat-mode .party{padding-top:7px;padding-bottom:7px}.combat-mode .turn-resources{margin-top:20px;padding-top:14px}}
@media(min-width:801px) and (max-width:1150px){.initiative-strip{margin-left:28px;margin-right:28px}.combat-mode .play-area{gap:26px}.initiative-order{gap:3px}.initiative-actor{font-size:9px}.combat-mode .party-member .avatar{width:24px;height:31px}.combat-mode .party-member{gap:5px}}
@media(max-width:800px){.initiative-strip{margin:14px 20px 0}.initiative-order{grid-template-columns:repeat(5,minmax(0,1fr))}.initiative-heading{align-items:start}.initiative-heading span{max-width:190px;text-align:right}.combat-mode .play-area{grid-template-columns:1fr;margin:20px;gap:24px}.combat-mode .decision{grid-row:1;min-height:0}.enemy-heading{margin-top:6px}.combat-mode .party-member .avatar{width:30px;height:38px}.prototype-feedback{align-items:start;padding:10px 18px;gap:12px}.combat-mode .combat-idle h1{font-size:34px}.combat-mode .turn-resources{margin-top:17px}.combat-mode .party-member .effect-badge{font-size:10px}}

.talk-details{flex-wrap:wrap}.talk-details .text-btn{display:inline-flex;align-items:center;gap:8px}.talk-details .rune{width:22px;height:22px}

<body>
<div class="prototype-bar"><div class="prototype-context"><strong>Makieta · przykładowy stan</strong><label id="help-demo-choice" class="help-demo-choice">Pomoc<select id="help-scenario" aria-label="Przykładowy stan rozmowy"><option value="pair">2 odbiorców</option><option value="team">5 odbiorców</option></select></label></div><label id="combat-fixture" class="combat-fixture" hidden>Przykład<select id="attack-mode" aria-label="Przykładowe wyposażenie Garrana"><option value="melee">Miecz i tarcza</option><option value="ranged">Kusza · bez tarczy</option></select></label><nav class="prototype-nav" aria-label="Przykładowe sceny"><button data-scene="start">Start</button><button data-scene="story">Narracja</button><button data-scene="talk">Rozmowa</button><button data-scene="draw">Dobór many</button><button data-scene="roll">Rzut</button><button data-scene="combat">Walka</button></nav></div>
<div id="prototype-board" class="prototype-board" aria-label="Symulacja run fizycznej planszy w makiecie" hidden></div>
<div id="prototype-targets" class="prototype-targets" hidden></div>
<div id="board-feedback" class="prototype-feedback" aria-live="polite" hidden></div>
<div class="app">
<header class="masthead"><div class="brand"><div class="brand-mark" aria-hidden="true"><span>D</span></div><div><strong>Dług za dzwon</strong><small>Misja 0 · Gildia Poszukiwaczy</small></div></div><div class="tools"><span class="connection">Przy wspólnej planszy</span><button class="text-btn" data-modal="journal">Dziennik</button><button class="text-btn" data-modal="menu" aria-label="Otwórz menu">Menu</button></div></header>
<main id="main" class="play-area" tabindex="-1"></main>
<footer class="party" id="party" aria-label="Drużyna — otwórz szczegóły bohatera"></footer>
</div>
<dialog id="details"><div class="dialog-head"><h2 id="dialog-title"></h2><button class="close" aria-label="Zamknij szczegóły" data-close>×</button></div><div id="dialog-content" class="dialog-content"></div></dialog>
<div id="toast" class="toast" role="status" hidden></div>
<script>
'use strict';
// Local presentation fixtures; this prototype does not call the game or hardware.
const ASSETS='../../content/scenarios/misja_0_dzwon/assets/images/comic_v2/';
// Stable panel paths/slots from src/dnd_board_game/ui/board_panel_symbols.py.
const RUNES={
0:['Ruch','M15 4a2 2 0 1 0-4 0 2 2 0 1 0 4 0M12 8l-2 6 5 3 2 5M10 14l-3 8M12 8l4 4h4M12 8H8l-4 5'],
1:['Atak','M5 19 18 6l3-3v6L8 22M3 14l7 7M5 21l-2 2'],
5:['Koniec tury','M5 22V3h14l-4 5 4 5H5'],
6:['Rozwidlenie','M12 21V4M4 5l8 7 8-7'],7:['Wieża','M5 21V4h14v17M5 10h14M12 4v17'],
8:['Klepsydra','M4 3h16L4 21h16Z'],9:['Trójząb','M12 22V2M4 3v8h16V3'],
10:['Brama','M3 21V8l9-6 9 6v13M8 21V11h8v10'],11:['Romb','M12 2 21 12 12 22 3 12ZM12 7v10'],
12:['Hak','M5 3h14v9H9v9M5 17l4 4 4-4'],13:['Błysk','M15 2 5 13h8l-4 9 11-13h-8Z'],14:['Oko','M2 12 12 5l10 7-10 7ZM12 9v6'],15:['Schody','M3 21v-6h6V9h6V3h6M3 3h6'],16:['Korona','M3 7l5 5 4-9 4 9 5-5v13H3Z'],17:['Węzeł','M3 8h18v8H3ZM8 3v18h8V3Z'],
18:['Grot','M4 21 12 3l8 18M8 14h8M12 14v7'],19:['Kotwica','M12 3v18M6 7h12M3 14l9 7 9-7M3 10v4M21 10v4'],24:['Klucz','M5 3h8v8H5ZM9 11v10h11v-5M15 21v-5'],25:['Gwiazda','M12 2v20M2 12h20M5 5l14 14M5 19 19 5M8 8h8v8H8Z'],26:['Zmniejsz','M4 12h16'],27:['Zwiększ','M4 12h16M12 4v16'],28:['Zatwierdź','M3 12l6 7L21 5'],29:['Wróć','M10 4 3 11l7 7M3 11h12a6 6 0 0 1 0 12']};

// Same five mana symbols as the current application, with names for accessibility.
const manaNames={C:'czerwona',N:'niebieska',Z:'zielona',B:'biała',F:'czarna'};
const manaPaths = {
  C:'M12 2C14 8 20 8 20 15a8 8 0 0 1-16 0c0-3 2-6 5-8-1 5 2 6 3 4 2-3 1-6 0-9Z',
  N:'M12 2C10 6 5 11 5 15a7 7 0 0 0 14 0c0-4-5-9-7-13ZM8 15c0 2 1 3 3 3',
  Z:'M9 22h6M10 22v-7H6a3 3 0 0 1-1-6 4 4 0 0 1 4-6 4 4 0 0 1 7 1 4 4 0 0 1 4 5 3 3 0 0 1-2 6h-4v7M10 16l-2-3M14 17l3-4',
  B:'M16 12a4 4 0 1 0-8 0 4 4 0 1 0 8 0M12 1v4M12 19v4M1 12h4M19 12h4M4 4l3 3M17 17l3 3M4 20l3-3M17 7l3-3',
  F:'M8 21v-4C2 16 2 3 12 3s10 13 4 14v4ZM9 21v-3M12 21v-3M15 21v-3M9 11a1.5 1.5 0 1 0-3 0 1.5 1.5 0 1 0 3 0M18 11a1.5 1.5 0 1 0-3 0 1.5 1.5 0 1 0 3 0M11 15l1-2 1 2Z',
  '*':'M22 12a10 10 0 1 0-20 0 10 10 0 1 0 20 0M9 9l3-3v12M9 18h6',
};
const manaIcon=color=>`<span class="mana-symbol mana-${color}" role="img" aria-label="Mana ${manaNames[color]}" title="Mana ${manaNames[color]}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="${manaPaths[color]}"/></svg></span>`;
const colorButtons=event=>['C','B','Z','F','N'].map((color,i)=>`<button class="color-choice" data-do="${event}" aria-label="Zgłoś kolor: ${manaNames[color]}">${rune(13+i)}${manaIcon(color)}</button>`).join('');

const HEROES=[['garran','Garran','Osobista gwarancja',4,28,28],['brakka','Brakka','Stanowcze żądania',3,35,35],['mira','Mira','Blef',4,21,21],['dagna','Dagna','Zrozumienie obaw',2,27,27],['lorian','Lorian','Komplementy',3,24,24],['nimra','Nimra','Logiczne argumenty',4,20,20]];
const state={combatBoardMode:null,helpScenario:'pair',helpIndex:0,supportOverride:null,helpPending:null,combatSlot:null,scene:'start',step:'check',roll:14,impact:4,deck:28,resistance:18,chosen:'red',returnTo:'talk',spent:false,aids:{garran:2,brakka:0,mira:0,dagna:1,lorian:0,nimra:0}};
const $=s=>document.querySelector(s);
const rune=slot=>`<svg class="rune" data-panel-slot="${slot}" viewBox="0 0 24 24" role="img" aria-label="Runa ${RUNES[slot][0]}"><path d="${RUNES[slot][1]}"/></svg>`;
const button=(title,sub,event,slot=null,main=false,cost='')=>`<button class="action ${main?'action-main':''}" data-do="${event}">${slot===null?'':rune(slot)}<span class="action-copy"><span class="action-title">${title}</span><span class="action-sub">${sub}</span></span>${cost?`<span class="action-cost">${cost}</span>`:'<span class="arrow" aria-hidden="true">→</span>'}</button>`;

// Example projections of two legal approach assignments, not live rule evaluation.
const HELP_SCENARIOS={
 pair:{approach:'Osobista gwarancja',ability:'Charyzma',modifier:0,dc:20,title:'Daj Nessie swoje słowo.',targets:['nimra','dagna']},
 team:{approach:'Zrozumienie obaw',ability:'Mądrość',modifier:1,dc:19,title:'Zrozum obawy Nessy.',targets:['brakka','mira','dagna','lorian','nimra']}
};
const HELP_NAMES={brakka:'Brakce',mira:'Mirze',dagna:'Dagnie',lorian:'Lorianowi',nimra:'Nimrze'};
const approach=()=>HELP_SCENARIOS[state.helpScenario];
const testBonus=()=>6+approach().modifier;
const frontBonus=()=>state.chosen==='blue'?1:2;
const impactExplanation=()=>`${approach().modifier?`${approach().modifier} z Mądrości + `:''}${frontBonus()} ze Wspólnego frontu`;
function helpTargets(){
 const ids=state.supportOverride===null?approach().targets:state.supportOverride;
 return ids.map(id=>{const index=HEROES.findIndex(h=>h[0]===id);const h=HEROES[index];return {id,name:h[1],method:h[2],slot:6+index,bonus:1,cost:1,aid:state.aids[id]||0}});
}
function helpCarousel(){
 const targets=helpTargets();
 if(!targets.length)return `<section class="help-carousel" aria-label="Pomoc"><div class="help-carousel-head"><strong>Pomoc</strong></div><p class="help-empty">Twoje podejście nie pozwala teraz pomóc żadnemu sojusznikowi.</p></section>`;
 state.helpIndex=((state.helpIndex%targets.length)+targets.length)%targets.length;
 const t=targets[state.helpIndex];
 return `<section class="help-carousel" aria-label="Wybór odbiorcy pomocy"><div class="help-carousel-head"><strong>Pomoc · spal ${t.cost} kartę</strong><span aria-live="polite" aria-atomic="true">${t.name} · ${state.helpIndex+1} z ${targets.length}</span></div><div class="help-carousel-row"><button class="help-cycle" data-board-slot="26" aria-label="Poprzedni odbiorca pomocy — minus" ${targets.length<2?'hidden':''}>${rune(26)}</button><button class="help-target" data-do="help-${t.id}" aria-label="Pomóż: ${t.name}, runa ${RUNES[t.slot][0]}, pomoc +${t.bonus}, razem +${t.aid+t.bonus}, spal ${t.cost} kartę"><img class="avatar" src="${ASSETS}${t.id}.png" alt=""><span class="action-copy"><span class="action-title">Pomóż ${HELP_NAMES[t.id]}</span><span class="action-sub">${t.method}</span><span class="help-result">Pomoc +${t.aid} → <b>+${t.aid+t.bonus}</b> do następnego testu</span></span>${rune(t.slot)}</button><button class="help-cycle" data-board-slot="27" aria-label="Następny odbiorca pomocy — plus" ${targets.length<2?'hidden':''}>${rune(27)}</button></div><p class="help-controls-hint">${targets.length>1?'− / + zmienia odbiorcę · ':''}runa ${RUNES[t.slot][0]} udziela pomocy</p></section>`;
}
function cycleHelp(direction){
 if(state.scene!=='talk'||$('#details').open||state.spent)return;
 const targets=helpTargets();if(targets.length<2)return;
 state.helpIndex=(state.helpIndex+direction+targets.length)%targets.length;
 const focused=document.activeElement;
 const focusSlot=focused?.dataset.boardSlot;
 const focusScope=focused?.closest('#prototype-board')?'#prototype-board':'.help-carousel';
 $('.help-carousel').outerHTML=helpCarousel();
 renderBoard();
 if(focusSlot)$(`${focusScope} [data-board-slot="${focusSlot}"]`)?.focus({preventScroll:true});
}
function setHelpScenario(value){
 if(!HELP_SCENARIOS[value])return;
 selectScene('talk');state.helpScenario=value;state.helpIndex=0;render(true);
}

function turn(label='Wybierz działanie'){return `<div class="turn-line"><div class="turn-actor"><img class="avatar" src="${ASSETS}garran.png" alt=""><div><strong>Tura Garrana</strong><small>${label}</small></div></div><span class="turn-number">${state.scene==='combat'?'Runda 3 · inicjatywa 18':'Runda 5 · 1 z 6'}</span></div>`}
function meter(){return `<div class="meter-row"><div class="resistance"><div class="meter-title"><span>Opór Nessy</span><b>${state.resistance} <span class="quiet">/ 54</span></b></div><div class="meter" role="meter" aria-label="Pozostały opór Nessy" aria-valuemin="0" aria-valuemax="54" aria-valuenow="${state.resistance}"><span style="width:${state.resistance/54*100}%"></span></div></div><button class="deck" data-modal="deck"><b>${state.deck}</b> <span>kart w talii ↗</span></button></div>`}
function art(kind='talk'){const story=kind==='story',combat=kind==='combat';return `<aside class="scene" aria-label="Kontekst sceny"><img class="scene-art" src="${ASSETS}${story?'road':combat?'posterunek':'nessa_portrait'}.png" alt="${story?'Wóz na leśnej drodze':combat?'Posterunek przy drodze':'Nessa przy stole Gildii'}"><span class="scene-heading">${story?'Droga do posterunku':combat?'Starcie przy posterunku':'Siedziba Gildii'}</span><div class="scene-content"><div class="eyebrow">${story?'Rozdział pierwszy':combat?'Walka':'Rozmowa'}</div><h2>${story?'Droga czeka.':combat?'Utrzymajcie pozycję.':'Jeszcze jedna prośba.'}</h2><p class="scene-quote">${story?'Koła wozu skrzypią na koleinach. Za wami zostają mury Gildii.':combat?'Zebrali się przy drodze. Dalej przejedziecie dopiero, gdy ustąpią.':'„Zapłata jest ustalona. O tym, co zabierzecie na drogę, możemy jeszcze porozmawiać.”'}</p><p class="scene-goal">${story?'<b>Wasz cel</b> · odbierzcie sprzęt, zapasy i dokumenty.':combat?'<b>Spójrzcie na planszę.</b> Podświetlone pola wskazują dostępny ruch i cele.':'<b>Przekonajcie Nessę</b> do dodatkowej mikstury leczenia.'}</p></div></aside>`}
function talkDetails(){return [
 {slot:24,modal:'calculation',label:`Skąd premia +${testBonus()}?`},
 {slot:25,modal:'passives',label:`Twoje efekty · ${state.chosen==='blue'?4:3}`}
]}
function talk(){return `${turn()}<h1>${approach().title}</h1><p class="intro">Twoje podejście: <span class="gold">${approach().approach}</span>.</p>${meter()}<div>${button('Podejmij próbę',`k20 + ${testBonus()} przeciw ST ${approach().dc} · po sukcesie wpływ k6 + ${impactBonus()}`,'test',18,true,'Spal 1 kartę<br>ze wspólnej talii')}${helpCarousel()}${button('Podejrzyj spód talii','Zostaw kartę na spodzie albo przełóż ją na wierzch','peek',19,false,'Bez spalania<br>Całe działanie')}</div><div class="action-details talk-details">${talkDetails().map(item=>`<button class="text-btn" data-modal="${item.modal}" data-board-slot="${item.slot}" aria-label="${item.label} — runa ${RUNES[item.slot][0]}">${rune(item.slot)}<span>${item.label}</span></button>`).join('')}</div>`}
function draw(){return `${turn('Początek tury · dobierz jedną kartę')}<h1>Co pomoże w rozmowie?</h1><p class="intro">Wybierz jedną kartę. Druga zostaje w ofercie dla następnego bohatera.</p><div class="small-summary"><span><b>3 / 6</b> kart w puli</span><span>Premia do testu <b>+3 → +4</b></span></div><div class="offer-grid"><button class="offer" data-do="take-red" aria-label="Weź czerwoną manę — runa Rozwidlenie"><span class="offer-top">${manaIcon('C')}${rune(6)}</span><h3>Wspólny front</h3><div class="change">Wpływ <b>+1 → +2</b></div><p>Po udanym teście z pomocą zyskasz <b>+2 wpływu</b>.</p><span class="take">Wybierz kartę <span aria-hidden="true">→</span></span></button><button class="offer" data-do="take-blue" aria-label="Weź niebieską manę — runa Wieża"><span class="offer-top">${manaIcon('N')}${rune(7)}</span><h3>Własny przykład</h3><div class="change">Odblokujesz <b>nowy efekt</b></div><p>Gdy pomożesz sojusznikowi, sam dostaniesz <b>+1 do następnego testu</b>.</p><span class="take">Wybierz kartę <span aria-hidden="true">→</span></span></button></div><p class="decision-note">W tej turze masz już otrzymaną pomoc +2.</p><div class="action-details"><button class="text-btn" data-modal="pool">Zobacz swoją pulę</button></div>`}
function rollView(){
 if(state.step==='burn')return `${turn('Rozlicz koszt próby')}<h1>Spal jedną kartę z talii.</h1><p class="intro">Odkryj wierzchnią kartę wspólnej talii, odłóż ją do spalonych i wskaż jej kolor.</p><div class="notice">Twoje <b>4 karty w osobistej puli</b> pozostają przy tobie.</div><div class="color-options">${colorButtons('burn')}</div><p class="decision-note">Po zgłoszeniu koloru swoją turę rozpocznie Brakka.</p>`;
 if(state.step==='failed')return `${turn('Wynik próby')}<div class="eyebrow">Nieudany test</div><h1>Nessa pozostaje nieprzekonana.</h1><div class="result-number">${state.roll+testBonus()} <span style="font-size:25px;color:var(--muted)">/ ST ${approach().dc}</span></div><p class="intro">Pomoc +2 została zużyta. Opór Nessy pozostaje bez zmian.</p><div class="notice"><b>Zbiórka</b> · każdy inny bohater dostaje +1 pomocy do swojej następnej próby.</div><button class="primary wide" data-do="next-hero">${rune(28)}Rozlicz koszt · spal 1 kartę</button>`;
 if(state.step==='result')return `${turn('Wynik próby')}<div class="eyebrow">Udana próba</div><h1>Twoje słowo ma znaczenie.</h1><div class="result-number">−${state.impact+impactBonus()}</div><p class="result-sub">oporu Nessy · wpływ ${state.impact} + ${impactExplanation()}</p>${meter()}<div class="notice">Pomoc <b>+2</b> została zużyta. Twoja osobista pula zostaje przy tobie.</div><button class="primary wide" data-do="next-hero">${rune(28)}Rozlicz koszt · spal 1 kartę</button>`;
 const impact=state.step==='impact';return `${turn(impact?'Udany test · określ wpływ':'Podejmujesz próbę')}<div class="roll-steps"><span class="${impact?'':'current'}">01 · Test k20 ${impact?'✓':''}</span><span aria-hidden="true">→</span><span class="${impact?'current':''}">02 · Wpływ k6</span></div><h1>${impact?'Teraz rzuć na wpływ.':'Rzuć kością k20.'}</h1><p class="intro">${impact?`Test ${state.roll} + ${testBonus()} = <span class="success">${state.roll+testBonus()} · sukces</span>. Wpisz wynik fizycznej kości k6.`:'Wpisz wynik fizycznej kości. Aplikacja doliczy premie.'}</p><div class="formula">${impact?`<div class="formula-part"><b>k6</b><small>twój rzut</small></div><span class="formula-sep">+</span><div class="formula-part"><b>${impactBonus()}</b><small>premie wpływu</small></div><span class="formula-sep">=</span><div class="formula-part"><b id="total">${state.impact+impactBonus()}</b><small>wpływu</small></div>`:`<div class="formula-part"><b>k20</b><small>twój rzut</small></div><span class="formula-sep">+</span><div class="formula-part"><b>${4+approach().modifier}</b><small>${approach().modifier?'karty + cecha':'karty'}</small></div><span class="formula-sep">+</span><div class="formula-part"><b>2</b><small>pomoc</small></div><span class="formula-sep">≥</span><div class="formula-part"><b>${approach().dc}</b><small>ST próby</small></div>`}</div><label for="die" class="eyebrow">${impact?'Wynik k6':'Wynik k20'}</label><div class="roll-input"><div class="stepper"><button data-do="minus" aria-label="Zmniejsz wynik o jeden">−</button><input id="die" type="number" min="1" max="${impact?6:20}" value="${impact?state.impact:state.roll}" inputmode="numeric" aria-label="Naturalny wynik kości ${impact?'k6':'k20'}"><button data-do="plus" aria-label="Zwiększ wynik o jeden">+</button></div><span>${impact?'Premia do testu nie zwiększa wpływu.':`${approach().ability} +${approach().modifier} · uwzględniona w wyniku`}</span></div><button class="primary wide" data-do="submit-roll function openModal(key){const content={
 calculation:['Twoja próba',`<p>${approach().approach} · ${approach().ability} · ST ${approach().dc}</p><div class="fact-row"><span>${approach().ability} Garrana</span><b>+${approach().modifier}</b></div><div class="fact-row"><span>4 fizyczne karty w puli</span><b>+4</b></div><div class="fact-row"><span>Otrzymana pomoc</span><b>+2</b></div><div class="fact-row"><span>Łączna premia do k20</span><b>+${testBonus()}</b></div><h3>Jeśli test się powiedzie</h3><p>Rzuć k6 na wpływ. Wspólny front doda ${frontBonus()} do wyniku, ponieważ korzystasz z pomocy i masz ${frontBonus()===2?'dwie czerwone karty':'czerwoną kartę'}. ${approach().modifier?'Mądrość daje dodatkowo +1 wpływu.':''}</p><p class="compact">Cała otrzymana pomoc znika po tej próbie k20, również po porażce.</p>`],
 passives:['Efekty Garrana',`<h3>Wspólny front</h3><p>Przy próbie z otrzymaną pomocą: po sukcesie +1 wpływu za czerwoną kartę, maksymalnie +2. Teraz: <b>+${frontBonus()} wpływu</b>.</p><h3>Zbiórka</h3><p>Po twoim nieudanym teście każdy inny bohater dostaje pomoc +1 do następnej próby.</p><h3>Utrzymać szyk</h3><p>Przy 6 fizycznych kartach reakcje spalają ze wspólnej talii o 1 kartę mniej. <span class="quiet">Warunek jeszcze niespełniony: masz 4 karty.</span></p>${state.chosen==='blue'?'<h3>Własny przykład</h3><p>Gdy pomagasz, sam także dostajesz +1 do swojej następnej próby.</p>':''}`],
 pool:['Osobista pula Garrana',`<div class="mana-pool">${(state.scene==='draw'?['C','F','Z']:['C','F','Z',state.chosen==='red'?'C':'N']).map(manaIcon).join('')}</div><div class="fact-row"><span>Każda fizyczna karta</span><b>+1 do testu</b></div><div class="fact-row"><span>Limit osobistej puli</span><b>6 kart</b></div><p>Test i pomoc spalają kartę ze wspólnej talii. Osobiste karty nadal uruchamiają twoje pasywy.</p>`],
 deck:['Wspólna talia',`<div class="fact-row"><span>Zakryta talia</span><b>${state.deck}</b></div><div class="fact-row"><span>Osobiste pule drużyny</span><b>${state.scene==='draw'?19:20}</b></div><div class="fact-row"><span>Odkryta oferta</span><b>${state.scene==='draw'?2:1}</b></div><div class="fact-row"><span>Spalone</span><b>${state.spent?12:11}</b></div><p>Na koniec rundy nastąpi reakcja Nessy. Rodzaj reakcji nie jest jeszcze znany.</p>`],
 journal:['Dziennik wyprawy',`<div class="timeline"><p><small>Bieżący cel</small>Przekonajcie Nessę do dodatkowej mikstury leczenia.</p><p><small>Ostatnia runda</small>W rozmowie udało się osłabić opór Nessy.</p><p><small>Przed wyruszeniem</small>Odbierzcie zlecenie i przygotujcie ekwipunek drużyny.</p></div>`],
 menu:['Przy stole',`<button class="modal-action" data-modal="mission"><b>Cel misji</b><small>Przypomnijcie sobie szczegóły zlecenia</small></button><button class="modal-action" data-modal="rules"><b>Pomoc w grze</b><small>Testy, pomoc i osobista pula kart</small></button><button class="modal-action" data-do="close"><b>Wróć do gry</b></button>`],
 rules:['Wspólna ściągawka',`<h3>Test</h3><p>Rzuć k20 i dodaj modyfikator cechy, liczbę fizycznych kart, pomoc i aktywne premie pasywów. Po sukcesie rzuć osobno na wpływ lub postęp.</p><h3>Pomoc</h3><p>Podstawowo daje +1 do następnej próby dozwolonego sojusznika i spala 1 kartę ze wspólnej talii. Pasywy bohaterów mogą zmienić koszt lub efekt. Kolejne pomoce się sumują.</p><h3>Podgląd</h3><p>Spójrz na spód talii. Zostaw kartę na spodzie albo przełóż na wierzch. To całe działanie, bez spalania i bez zgłaszania koloru.</p>`],
 mission:['Wasze zlecenie',`<p>Odbierzcie sprzęt, zapasy i dokumenty. Gildia oczekuje zwrotu wozu wraz z woźnicami.</p><h3>Teraz: dodatkowa mikstura</h3><p>Przekonajcie Nessę, żeby dorzuciła miksturę leczenia: 2k8 + 4 PW.</p>`],
 'combat-pool':['Karty Garrana · walka',`<div class="mana-pool">${['B','B','C','N'].map(manaIcon).join('')}</div><div class="fact-row"><span>4 fizyczne karty</span><b>Test +4</b></div><div class="fact-row"><span>4 karty + 2 białe atuty</span><b>Ładunek 6 / 6</b></div><p>Biały jest atutem Garrana: daje dodatkowy punkt ładunku zdolności. Nadal liczy się jako jedna karta do testu.</p><h3>Natarcie</h3><p>Czerwona karta daje +1 do obrażeń broni wręcz.</p><h3>Osłona</h3><p>Niebieska karta daje +1 KP.</p><h3>Żelazna linia</h3><p>Gdy razem flankujecie wroga, sojusznik ma przeciw niemu +1 KP. Ty nie otrzymujesz tej premii.</p>`]
 };if(content[key])modal(...content[key])}
function hero(id){if(state.scene==='combat'){CombatFlow.selectActor(id);return}const h=HEROES.find(h=>h[0]===id);modal(h[1],`<div class="hero-detail-head"><img src="${ASSETS}${id}.png" alt="${h[1]}"><div><h3>${state.scene==='combat'?'W walce':id==='garran'?approach().approach:h[2]}</h3><p>${h[3]} / 6 kart · premia do testów +${h[3]}</p></div></div>${id==='garran'?`<p>${approach().approach} · ${approach().ability} +${approach().modifier} · ST ${approach().dc} · wpływ k6 +${approach().modifier}.</p><div class="fact-row"><span>Otrzymana pomoc</span><b>+2</b></div><button class="modal-action" data-modal="passives"><b>Pasywy z osobistej puli</b><small>Zobacz warunki i efekty</small></button>`:`<p>${state.scene==='combat'?'Kolejny bohater oczekuje na swoją turę.':'Podejście wybrane na czas tej rozmowy.'}</p>`}`)}
function action(name){
 if(state.scene==='combat'&&CombatFlow.action(name))return;
 if(name==='aura-preview'){showBoardPreview('bless');return}
 if(name==='clear-board-preview'){state.combatBoardMode=null;render();return}
 if(name==='close'){$('#details').close();return}
 if(name==='test'){state.scene='roll';state.step='check';render(true);return}
 if(name==='burn'){state.deck=27;state.spent=true;action('next-hero');return}
 if(name==='take-red'||name==='take-blue'){state.chosen=name==='take-red'?'red':'blue';state.scene='talk';render(true);toast('Karta dobrana · 4/6 kart · premia do testu +4');return}
 if(name.startsWith('help-')&&name!=='help-paid'){
  if(state.scene!=='talk'||state.spent||state.helpPending||$('#details').open)return;
  const t=helpTargets().find(t=>name==='help-'+t.id);if(!t)return;
  state.helpPending=t.id;state.aids[t.id]+=t.bonus;if(state.chosen==='blue')state.aids.garran+=1;
  modal('Pomoc dla '+t.name,`<p><b>${t.name}</b> otrzymuje +${t.bonus} pomocy. Łącznie <b>+${state.aids[t.id]}</b> do następnego testu.</p><p>Spal wierzchnią kartę wspólnej talii i zgłoś jej kolor.</p><div class="color-options">${colorButtons('help-paid')}</div>`);return;
 }
 if(name==='help-paid'){if(!state.helpPending||state.spent)return;state.helpPending=null;state.deck=27;state.spent=true;render();modal('Pomoc udzielona',`<p>Premia zostaje przy odbiorcy do jego następnej próby k20.${state.chosen==='blue'?' Własny przykład: ty też otrzymujesz pomoc +1.':''}</p><p>Teraz działa Brakka.</p><button class="primary wide" data-do="preview-end">Zakończ podgląd sceny</button>`);return}
 if(name==='peek'){modal('Podejrzyj dolną kartę',`<p>Spójrz na kartę na spodzie wspólnej talii. Nie zgłaszaj jej koloru.</p>${button('Zostaw na spodzie','Zachowaj kolejność talii','peek-done',18)}${button('Przenieś na wierzch','Ta karta będzie następna do odkrycia','peek-done',19)}<p class="compact">To całe działanie. Nie spalasz karty.</p>`);return}
 if(name==='peek-done'){modal('Podgląd zakończony',`<p>Całe działanie Garrana zostało wykorzystane. Teraz działa Brakka.</p><button class="primary wide" data-do="preview-end">Zakończ podgląd sceny</button>`);return}
 if(name==='plus'||name==='minus'){const input=$('#die'),limit=state.step==='impact'?6:20;input.value=Math.max(1,Math.min(limit,Number(input.value)+(name==='plus'?1:-1)));setRoll();return}
 if(name==='submit-roll'){if(!$('#die').reportValidity())return;setRoll();if(state.step==='impact'){state.aids.garran=0;state.resistance=Math.max(0,18-state.impact-impactBonus());state.step='result'}else {state.aids.garran=0;state.step=state.roll+testBonus()>=approach().dc?'impact':'failed';if(state.step==='failed')HEROES.slice(1).forEach(h=>state.aids[h[0]]+=1)}render(true);return}
 if(name==='next-hero'){if(!state.spent){state.step='burn';render(true);return}modal('Teraz działa Brakka',`<p>Kolejna tura zaczyna się od doboru many.</p><button class="primary wide" data-do="preview-end">Zakończ podgląd sceny</button>`);return}
 if(name==='preview-end'){$('#details').close();selectScene('talk');return}
 if(name==='story-talk'){selectScene('talk');return}
 if(name==='combat-back'){state.combatSlot=null;render(true);return}
 if(name==='combat-use'){const a=COMBAT_ACTIONS[state.combatSlot];if(a&&!a.blocked)modal(a.name,`<p>${a.next}</p><button class="secondary" data-do="close">Zamknij</button>`);return}

}
function setRoll(){const input=$('#die');if(!input||!input.validity.valid)return;const value=Number(input.value);if(state.step==='impact'){state.impact=value;$('#total').textContent=value+impactBonus()}else state.roll=value}
document.addEventListener('click',event=>{const b=event.target.closest('button');if(!b)return;if(b.dataset.startOption!==undefined){BoardNavigation.chooseStart(Number(b.dataset.startOption));return}if(b.dataset.combatTarget){CombatFlow.selectTarget(b.dataset.combatTarget);return}if(b.dataset.combatActor){CombatFlow.selectActor(b.dataset.combatActor);return}if(b.dataset.locateActor){showBoardPreview(b.dataset.locateActor);return}if(b.hasAttribute('data-board-slot')){boardRune(Number(b.dataset.boardSlot));return}if(b.hasAttribute('data-close')){if(!state.helpPending)$('#details').close();return}if(b.dataset.scene){selectScene(b.dataset.scene);return}if(b.dataset.modal){openModal(b.dataset.modal);return}if(b.dataset.hero){hero(b.dataset.hero);return}if(b.dataset.do)action(b.dataset.do)});
document.addEventListener('change',event=>{if(event.target.id==='help-scenario')setHelpScenario(event.target.value);if(event.target.id==='attack-mode')CombatFlow.setAttackMode(event.target.value)});
document.addEventListener('input',event=>{if(event.target.id==='die')setRoll()});
document.addEventListener('keydown',event=>{
 if(event.target.matches?.('input,select,textarea')){if(event.key==='Enter'&&event.target.id==='die'){event.preventDefault();action('submit-roll')}return}
 const slot={'-':26,'+':27,'=':27,'Enter':28,'Escape':29}[event.key];
 if(slot!==undefined){event.preventDefault();boardRune(slot)}
});
$('#details').addEventListener('cancel',event=>{event.preventDefault();boardRune(29)});
$('#details').addEventListener('click',event=>{if(!state.helpPending&&event.target===$('#details')){const r=$('#details').getBoundingClientRect();if(event.clientX<r.left||event.clientX>r.right||event.clientY<r.top||event.clientY>r.bottom)$('#details').close()}});
</script>
<script src="combat-flow.js"></script>
<script src="board-navigation.js"></script>
<script>render();</script>
</body>
</html>
