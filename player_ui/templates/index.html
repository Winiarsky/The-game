<!doctype html>
<html lang="pl">
<head>
    <meta charset="utf-8">
    <title>Boardgame Player UI</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
    <div class="frame">
        <header class="topbar">
            <div class="logo">The Game · UI</div>
            <div class="menu">
                <button id="btn-new-game">Nowa gra</button>
                <button id="btn-load" class="disabled" title="Jeszcze nieaktywne" disabled>Wczytaj</button>
                <button id="btn-quit">Quit</button>
            </div>
        </header>

        <section id="screen-menu" class="panel">
            <div class="panel-header">Scenariusz</div>
            <div class="panel-body scenario-picker">
                <p>Wybierz scenariusz, aby wystartować UI dla graczy.</p>
                <div class="scenario-list">
                    <button class="scenario-btn" data-scenario="karczma">Karczma</button>
                </div>
            </div>
        </section>

        <section id="screen-game" class="screen hidden">
            <div class="layout">
                <div class="column heroes-col">
                    <div class="panel">
                        <div class="panel-header">Bohaterowie</div>
                        <div class="panel-body">
                            <div id="heroes-list" class="heroes-list"></div>
                        </div>
                    </div>
                </div>
                <div class="column log-col">
                    <div class="panel log-panel">
                        <div class="panel-header">Log</div>
                        <div class="panel-body">
                            <ul id="log-list" class="log-list"></ul>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </div>

    <div id="path-toast" class="toast hidden"></div>

    <div id="prompt-modal" class="modal hidden">
        <div class="modal-card">
            <div class="modal-illustration"></div>
            <div class="modal-content">
                <div class="modal-title" id="modal-title">Akcja</div>
                <div class="modal-text" id="modal-text">Opis</div>
                <div class="modal-choices" id="modal-choices"></div>
                <div class="modal-desc" id="modal-desc"></div>
                <form id="modal-form">
                    <input type="text" id="modal-answer" autocomplete="off" placeholder="Twoja odpowiedź..." required />
                    <button type="submit">Wyślij</button>
                </form>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
