<!doctype html>
<html lang="pl">
<head>
    <meta charset="utf-8">
    <title>Boardgame Player UI</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
    <div class="frame">
        <header class="topbar" id="topbar">
            <div class="logo">The Game · UI</div>
            <div class="menu">
                <button id="btn-new-game">Nowa gra</button>
                <button id="btn-load" class="disabled" title="Jeszcze nieaktywne" disabled>Wczytaj</button>
                <button id="btn-quit">Quit</button>
            </div>
            <button class="bar-toggle" id="topbar-toggle" title="Schowaj pasek">▲</button>
        </header>

        <section id="screen-menu" class="panel">
            <div class="panel-header">Scenariusz</div>
            <div class="panel-body scenario-picker">
                <p>Wybierz scenariusz, aby wystartować UI dla graczy.</p>
                <div class="scenario-list">
                    <button class="scenario-btn" data-scenario="karczma">Karczma</button>
                </div>
            </div>
        </section>

        <section id="screen-game" class="screen hidden">
            <div class="game-layout">
                <div class="initiative-bar">
                    <div id="initiative-summary" class="initiative-summary hidden">
                        <div class="init-active">
                            <div class="label">Aktywny</div>
                            <div id="init-active-name" class="value">-</div>
                        </div>
                        <div class="init-next">
                            <div class="label">Następny</div>
                            <div id="init-next-name" class="value">-</div>
                        </div>
                        <div class="init-round">
                            <div class="label">Runda</div>
                            <div id="init-round-num" class="value">-</div>
                        </div>
                    </div>
                    <div id="initiative-list" class="initiative-list empty-note">Brak danych o inicjatywie.</div>
                </div>

                <div class="main-area">
                    <div class="panel heroes-panel">
                        <div class="panel-header">Bohaterowie</div>
                        <div class="panel-body">
                            <div id="heroes-list" class="heroes-list"></div>
                        </div>
                    </div>

                    <div class="panel action-panel">
                        <div class="panel-body action-body">
                            <div class="action-illustration" id="action-illustration"></div>
                            <div class="action-content">
                                <div class="action-badges">
                                    <span class="badge" id="action-kind"></span>
                                    <span class="badge" id="action-source"></span>
                                </div>
                                <div class="action-title" id="action-title">Czekam na działania...</div>
                                <div class="action-text" id="action-text"></div>
                                <div class="action-choices" id="action-choices"></div>
                                <div class="action-desc" id="action-desc"></div>
                                <form id="action-form" class="action-form">
                                    <input type="text" id="action-answer" autocomplete="off" placeholder="Wpisz odpowiedź lub wybierz kartę..." />
                                    <button type="submit">OK</button>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </div>

    <div id="path-toast" class="toast hidden"></div>

    <div id="log-drawer" class="log-drawer collapsed">
        <button id="log-toggle" class="log-toggle" title="Pokaż logi">Log</button>
        <div class="log-last" id="log-last">Logi będą tu widoczne.</div>
        <ul id="log-list" class="log-list"></ul>
    </div>

    <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
