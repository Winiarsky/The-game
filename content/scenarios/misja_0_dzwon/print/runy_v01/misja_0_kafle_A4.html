<!doctype html><html lang="pl"><meta charset="utf-8"><title>Misja 0 — kafle A4</title><style>@page{size:A4;margin:0}*{box-sizing:border-box}body{margin:0}section{width:210mm;height:297mm;break-after:page;overflow:hidden}section:last-child{break-after:auto}svg{display:block}</style><body><section><svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" font-family="DejaVu Sans,Arial,sans-serif"><text x="10" y="17" font-size="5" text-anchor="start">MISJA 0 · ELEMENTY DO WYCIĘCIA</text><text x="10" y="28" font-size="3" text-anchor="start">Druk jednostronny A4 • skala 100% • bez dopasowania do strony.</text><text x="10" y="34" font-size="3" text-anchor="start">Warstwy: plansza → własne tło → wycięte kafle → figurki.</text><text x="10" y="40" font-size="3" text-anchor="start">Wytnij zewnętrzny obrys razem z podpisem. Nie tnij ramki obrazka.</text><text x="10" y="46" font-size="3" text-anchor="start">Budynki wytnij w całości. Nie rozdzielaj ich na pojedyncze pola.</text><text x="10" y="52" font-size="3" text-anchor="start">Blokada / blokuje ruch: w walce blokuje wejście i widoczność.</text><text x="10" y="58" font-size="3" text-anchor="start">+2 KP: można wejść; premia KP dla figurki stojącej na kaflu.</text><text x="10" y="64" font-size="3" text-anchor="start">Osłona na linii strzału: +2 KP celu przeciw atakom dystansowym.</text><text x="10" y="70" font-size="3" text-anchor="start">KOSZT RUCHU ×2: wejście na pole kosztuje 10 ft zamiast 5 ft.</text><text x="10" y="76" font-size="3" text-anchor="start">I / kółko: interakcja. W eksploracji blokady i premie są nieaktywne.</text><text x="10" y="82" font-size="3" text-anchor="start">P15 Rozmowa: połóż dopiero po walce; nie zastępuje figurki Boruta.</text><text x="10" y="88" font-size="3" text-anchor="start">P02 Wóz: droga (9,16)–(9,17), potem posterunek (9,24)–(9,25).</text><text x="10" y="94" font-size="3" text-anchor="start">Gildia i posterunek używają oddzielnych zestawów, bez nakładania.</text><text x="10" y="100" font-size="3" text-anchor="start">Runy v0.1: dotychczasowa korekta × 1,03. Dopasuj do nowej planszy.</text><path d="M10 110h105.533m0-2v4M10 108v4" stroke="black" stroke-width=".4"/><text x="10" y="118" font-size="2.9" text-anchor="start">Odcinek kontrolny: 4 pola; porównaj z nową planszą i czujnikami.</text><text x="10" y="130" font-size="3.3" text-anchor="start">SPIS KAFELKÓW · rozmiar w polach · narożnik (kol., wiersz)</text><text x="10" y="138" font-size="3" text-anchor="start">P01  Dzwon na podstawie  ·  1×2  ·  (9, 15)  ·  BLOKADA</text><text x="10" y="145" font-size="3" text-anchor="start">P02  Wóz  ·  1×2  ·  (9, 24)  ·  BLOKADA</text><text x="10" y="152" font-size="3" text-anchor="start">P03  Skrzynia A  ·  1×1  ·  (7, 17)  ·  BLOKADA</text><text x="10" y="159" font-size="3" text-anchor="start">P04  Skrzynia B  ·  1×1  ·  (12, 17)  ·  BLOKADA</text><text x="10" y="166" font-size="3" text-anchor="start">P05  Zbrojownia  ·  8×6  ·  (1, 5)  ·  BLOKADA</text><text x="10" y="173" font-size="3" text-anchor="start">P06  Kwatera dowódcy  ·  8×6  ·  (10, 4)  ·  BLOKADA</text><text x="10" y="180" font-size="3" text-anchor="start">P07  Magazynek  ·  5×4  ·  (2, 14)  ·  BLOKADA</text><text x="10" y="187" font-size="3" text-anchor="start">P08  Worki A  ·  1×2  ·  (6, 18)  ·  +2 KP</text><text x="10" y="194" font-size="3" text-anchor="start">P09  Worki B  ·  1×2  ·  (12, 18)  ·  +2 KP</text><text x="10" y="201" font-size="3" text-anchor="start">P10  Niski murek  ·  1×1  ·  (8, 13)  ·  +2 KP</text><text x="10" y="208" font-size="3" text-anchor="start">P11  Gruz A  ·  1×2  ·  (7, 18)  ·  KOSZT RUCHU ×2</text><text x="10" y="215" font-size="3" text-anchor="start">P12  Gruz B  ·  1×3  ·  (11, 17)  ·  KOSZT RUCHU ×2</text><text x="10" y="222" font-size="3" text-anchor="start">P13  Głaz A  ·  1×1  ·  (4, 20)  ·  BLOKADA</text><text x="10" y="229" font-size="3" text-anchor="start">P14  Głaz B  ·  1×1  ·  (15, 16)  ·  BLOKADA</text><text x="10" y="236" /text><text x="10" y="245" font-size="3.1" text-anchor="start">Figurki wrogów i bohaterów ustawiaj według bieżącego setupu.</text><text x="10" y="252" font-size="3.1" text-anchor="start">Rysunki mebli są dekoracją. Zasady określają podpis i obrys kafla.</text><text x="10" y="259" font-size="3.1" text-anchor="start">Kreski na zewnętrznej krawędzi wyznaczają granice pól.</text><text x="10" y="266" font-size="3.1" text-anchor="start">Obróć wycinanki o 90° w lewo względem siatki powyżej.</text><text x="10" y="273" font-size="3.1" text-anchor="start">Gruba krawędź każdego obrysu wskazuje stronę podpisu kafla.</text></svg></section><section><svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" font-family="DejaVu Sans,Arial,sans-serif"><text x="10" y="16" font-size="4.5" text-anchor="start">MISJA 0 · KAFLE 1</text><text x="10" y="23" font-size="3" text-anchor="start">Tnij zewnętrzny obrys razem z podpisem. Druk 100%.</text><g data-cutout="G02" transform="translate(10 30)"><rect x=".15" y=".15" width="131.616" height="237.149" fill="white" stroke="black" stroke-width=".3"/><image href="file:///home/winiar/Desktop/projects/boardgame/The%20game/The-game/content/scenarios/misja_0_dzwon/maps/illustrations/ink_v3/arena.png" x="1.5" y="1.5" width="128.916" height="227.449" preserveAspectRatio="xMidYMid meet"/><rect x="1" y="1" width="129.916" height="228.449" fill="none" stroke="black" stroke-width=".35"/><path d="M26.3832 0v.8M26.3832 236.649v.8" stroke="black" stroke-width=".2"/><path d="M52.7664 0v.8M52.7664 236.649v.8" stroke="black" stroke-width=".2"/><path d="M79.1496 0v.8M79.1496 236.649v.8" stroke="black" stroke-width=".2"/><path d="M105.533 0v.8M105.533 236.649v.8" stroke="black" stroke-width=".2"/><path d="M0 26.3832h.8M131.116 26.3832h.8" stroke="black" stroke-width=".2"/><path d="M0 52.7664h.8M131.116 52.7664h.8" stroke="black" stroke-width=".2"/><path d="M0 79.1496h.8M131.116 79.1496h.8" stroke="black" stroke-width=".2"/><path d=
