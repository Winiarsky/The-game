<!doctype html><html lang="pl"><meta charset="utf-8"><title>Misja 0 — kafle A4</title><style>@page{size:A4;margin:0}*{box-sizing:border-box}body{margin:0}section{width:210mm;height:297mm;break-after:page;overflow:hidden}section:last-child{break-after:auto}svg{display:block}</style><body><section><svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" font-family="DejaVu Sans,Arial,sans-serif"><text x="10" y="17" font-size="5" text-anchor="start">MISJA 0 · ELEMENTY DO WYCIĘCIA</text><text x="10" y="28" font-size="3" text-anchor="start">Druk jednostronny A4 • skala 100% • bez dopasowania do strony.</text><text x="10" y="34" font-size="3" text-anchor="start">Warstwy: plansza → własne tło → wycięte kafle → figurki.</text><text x="10" y="40" font-size="3" text-anchor="start">Wytnij zewnętrzny obrys razem z podpisem. Nie tnij ramki obrazka.</text><text x="10" y="46" font-size="3" text-anchor="start">Budynki wytnij w całości. Nie rozdzielaj ich na pojedyncze pola.</text><text x="10" y="52" font-size="3" text-anchor="start">Blokada / blokuje ruch: w walce blokuje wejście i widoczność.</text><text x="10" y="58" font-size="3" text-anchor="start">+2 KP: można wejść; premia KP dla figurki stojącej na kaflu.</text><text x="10" y="64" font-size="3" text-anchor="start">Osłona na linii strzału: +2 KP celu przeciw atakom dystansowym.</text><text x="10" y="70" font-size="3" text-anchor="start">KOSZT RUCHU ×2: wejście na pole kosztuje 10 ft zamiast 5 ft.</text><text x="10" y="76" font-size="3" text-anchor="start">I / kółko: interakcja. W eksploracji blokady i premie są nieaktywne.</text><text x="10" y="82" font-size="3" text-anchor="start">P15 Rozmowa: połóż dopiero po walce; nie zastępuje figurki Boruta.</text><text x="10" y="88" font-size="3" text-anchor="start">P02 Wóz: droga (9,16)–(9,17), potem posterunek (9,24)–(9,25).</text><text x="10" y="94" font-size="3" text-anchor="start">Gildia i posterunek używają oddzielnych zestawów, bez nakładania.</text><text x="10" y="100" font-size="3" text-anchor="start">Kalibracja areny 250/244; po wydruku 4 pola powinny mieć 100 mm.</text><path d="M10 110h102.459m0-2v4M10 108v4" stroke="black" stroke-width=".4"/><text x="10" y="118" font-size="2.9" text-anchor="start">Odcinek kontrolny: 100 mm na skalibrowanym wydruku.</text><text x="10" y="130" font-size="3.3" text-anchor="start">SPIS KAFELKÓW · rozmiar w polach · narożnik (kol., wiersz)</text><text x="10" y="138" font-size="3" text-anchor="start">P01  Dzwon na podstawie  ·  1×2  ·  (9, 15)  ·  BLOKADA</text><text x="10" y="145" font-size="3" text-anchor="start">P02  Wóz  ·  1×2  ·  (9, 24)  ·  BLOKADA</text><text x="10" y="152" font-size="3" text-anchor="start">P03  Skrzynia A  ·  1×1  ·  (7, 17)  ·  BLOKADA</text><text x="10" y="159" font-size="3" text-anchor="start">P04  Skrzynia B  ·  1×1  ·  (12, 17)  ·  BLOKADA</text><text x="10" y="166" font-size="3" text-anchor="start">P05  Zbrojownia  ·  8×6  ·  (1, 5)  ·  BLOKADA</text><text x="10" y="173" font-size="3" text-anchor="start">P06  Kwatera dowódcy  ·  8×6  ·  (10, 4)  ·  BLOKADA</text><text x="10" y="180" font-size="3" text-anchor="start">P07  Magazynek  ·  5×4  ·  (2, 14)  ·  BLOKADA</text><text x="10" y="187" font-size="3" text-anchor="start">P08  Worki A  ·  1×2  ·  (6, 18)  ·  +2 KP</text><text x="10" y="194" font-size="3" text-anchor="start">P09  Worki B  ·  1×2  ·  (12, 18)  ·  +2 KP</text><text x="10" y="201" font-size="3" text-anchor="start">P10  Niski murek  ·  1×1  ·  (8, 13)  ·  +2 KP</text><text x="10" y="208" font-size="3" text-anchor="start">P11  Gruz A  ·  1×2  ·  (7, 18)  ·  KOSZT RUCHU ×2</text><text x="10" y="215" font-size="3" text-anchor="start">P12  Gruz B  ·  1×3  ·  (11, 17)  ·  KOSZT RUCHU ×2</text><text x="10" y="222" font-size="3" text-anchor="start">P13  Głaz A  ·  1×1  ·  (4, 20)  ·  BLOKADA</text><text x="10" y="229" font-size="3" text-anchor="start">P14  Głaz B  ·  1×1  ·  (15, 16)  ·  BLOKADA</text><text x="10" y="236" font-size="3" t t-anchor="middle">18</text><text x="-1" y="3.08" font-size="1.8" text-anchor="end">0</text><text x="-1" y="11.88" font-size="1.8" text-anchor="end">2</text><text x="-1" y="20.68" font-size="1.8" text-anchor="end">4</text><text x="-1" y="29.48" font-size="1.8" text-anchor="end">6</text><text x="-1" y="38.28" font-size="1.8" text-anchor="end">8</text><text x="-1" y="47.08" font-size="1.8" text-anchor="end">10</text><text x="-1" y="55.88" font-size="1.8" text-anchor="end">12</text><text x="-1" y="64.68" font-size="1.8" text-anchor="end">14</text><text x="-1" y="73.48" font-size="1.8" text-anchor="end">16</text><text x="-1" y="82.28" font-size="1.8" text-anchor="end">18</text><text x="-1" y="91.08" font-size="1.8" text-anchor="end">20</text><text x="-1" y="99.88" font-size="1.8" text-anchor="end">22</text><text x="-1" y="108.68" font-size="1.8" text-anchor="end">24</text><text x="-1" y="117.48" font-size="1.8" text-anchor="end">26</text><text x="-1" y="126.28" font-size="1.8" text-anchor="end">28</text></g><text x="10" y="189" font-size="3.1" text-anchor="start">Współrzędne od zera: kolumna 0–18, wiersz 0–29.</text><text x="10" y="196" font-size="3.1" text-anchor="start">Szary pas kolumny 19 to panel sterowania — zostaw go wolny.</text><text x="10" y="203" font-size="3.1" text-anchor="start">Dół dla graczy = strona run. Wszystkie podpisy skieruj ku runom.</text><text x="10" y="210" font-size="3.1" text-anchor="start">Budynki zajmują cały prostokąt. Kółko wskazuje pole interakcji.</text><text x="10" y="217" font-size="3.1" text-anchor="start">Gildia: drużyna (9,18), Nessa (5,7). Wyjście: G03 (9,24).</text><text x="10" y="224" font-size="3.1" text-anchor="start">Droga: tylko P02 Wóz i figurka drużyny; potem zmień tło.</text><text x="10" y="231" font-size="3.1" text-anchor="start">Walka: rozstaw P01–P14 według podświetlenia w aplikacji.</text><text x="10" y="238" font-size="3.1" text-anchor="start">Po walce zostaw kafle i dołóż P15; drużyna wraca na (9,20).</text><text x="10" y="245" font-size="3.1" text-anchor="start">Figurki wrogów i bohaterów ustawiaj według bieżącego setupu.</text><text x="10" y="252" font-size="3.1" text-anchor="start">Rysunki mebli są dekoracją. Zasady określają podpis i obrys kafla.</text><text x="10" y="259" font-size="3.1" text-anchor="start">Kreski na zewnętrznej krawędzi wyznaczają granice pól.</text><text x="10" y="266" font-size="3.1" text-anchor="start">Obróć wycinanki o 90° w lewo względem siatki powyżej.</text><text x="10" y="273" font-size="3.1" text-anchor="start">Gruba krawędź każdego obrysu wskazuje stronę podpisu kafla.</text></svg></section><section><svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" font-family="DejaVu Sans,Arial,sans-serif"><text x="10" y="16" font-size="4.5" text-anchor="start">MISJA 0 · KAFLE 1</text><text x="10" y="23" font-size="3" text-anchor="start">Tnij zewnętrzny obrys razem z podpisem. Druk 100%.</text><g data-cutout="G02" transform="translate(10 30)"><rect x=".15" y=".15" width="127.774" height="230.233" fill="white" stroke="black" stroke-width=".3"/><image href="../illustrations/ink_v3/arena.png" x="1.5" y="1.5" width="125.074" height="220.533" preserveAspectRatio="xMidYMid meet"/><rect x="1" y="1" width="126.074" height="221.533" fill="none" stroke="black" stroke-width=".35"/><path d="M25.6148 0v.8M25.6148 229.733v.8" stroke="black" stroke-width=".2"/><path d="M51.2295 0v.8M51.2295 229.733v.8" stroke="black" stroke-width=".2"/><path d="M76.8443 0v.8M76.8443 229.733v.8" stroke="black" stroke-width=".2"/><path d="M102.459 0v.8M102.459 229.733v.8" stroke="black" stroke-width=".2"/><path d="M0 25.6148h.8M127.274 25.6148h.8" stroke="black" stroke-width=".2"/><path d="M0 51.2295h.8M127.274 51.2295h.8" stroke="black" stroke-width=".2"/><path d="M0 76.8443h.8M127.274 76.8443h.8" stroke="black" stroke-width=".2"/><path d="M0 102.459h.8M127.274 102.459h.8" stroke="black" stroke-width=".2"/><path d="M0 128.074h.8M127.274 128.074h.8" stro
