<circle cx="21.0" cy="149.0" r="5" fill="#c43d1f" stroke="#7e1d0d" stroke-width="1.4" />
<text x="21.0" y="150.2" style="font: 700 5px &quot;DejaVu Sans Mono&quot;, monospace; fill: #fff; text-anchor: middle; dominant-baseline: middle;">GW</text>
<text x="32.0" y="151.0" class="legend-label">goblin_warrior</text>
<circle cx="21.0" cy="161.0" r="5" fill="#8d1f14" stroke="#4c0f09" stroke-width="1.4" />
<text x="21.0" y="162.2" style="font: 700 5px &quot;DejaVu Sans Mono&quot;, monospace; fill: #fff; text-anchor: middle; dominant-baseline: middle;">GC</text>
<text x="32.0" y="163.0" class="legend-label">goblin_commando</text>
<circle cx="21.0" cy="173.0" r="5" fill="#6d5637" stroke="#3e2f1b" stroke-width="1.4" />
<text x="21.0" y="174.2" style="font: 700 5px &quot;DejaVu Sans Mono&quot;, monospace; fill: #fff; text-anchor: middle; dominant-baseline: middle;">GD</text>
<text x="32.0" y="175.0" class="legend-label">goblin_dog</text>
<circle cx="21.0" cy="185.0" r="5" fill="#b60000" stroke="#630000" stroke-width="1.4" />
<text x="21.0" y="186.2" style="font: 700 5px &quot;DejaVu Sans Mono&quot;, monospace; fill: #fff; text-anchor: middle; dominant-baseline: middle;">E</text>
<text x="32.0" y="187.0" class="legend-label">simple_enemy</text>
<text x="16.0" y="201.0" class="legend-head">Counts</text>
<text x="16.0" y="212.0" class="legend-label">terrains: 27</text>
<text x="16.0" y="222.0" class="legend-label">obstacles: 10</text>
<text x="16.0" y="232.0" class="legend-label">walls: 11</text>
<text x="16.0" y="242.0" class="legend-label">enemies: 4</text>
<text x="16.0" y="256.0" class="legend-head">Notes</text>
<text x="16.0" y="268.0" class="legend-label">Druzyna stoi przy zachodnim</text>
<text x="16.0" y="277.0" class="legend-label">skraju, a linie podejscia</text>
<text x="16.0" y="286.0" class="legend-label">rozchodza sie szeroko az do</text>
<text x="16.0" y="295.0" class="legend-label">dalekiego wschodu.</text>
<text x="16.0" y="304.0" class="legend-label">Commando siedzi na perchu w prawym</text>
<text x="16.0" y="313.0" class="legend-label">gornym rogu i testuje presje przez</text>
<text x="16.0" y="322.0" class="legend-label">dlugi korytarz.</text>
<text x="16.0" y="331.0" class="legend-label">Goblin dog dostaje daleka</text>
<text x="16.0" y="340.0" class="legend-label">poludniowo-wschodnia flanke,</text>
<text x="16.0" y="349.0" class="legend-label">dzieki czemu latwiej obserwowac</text>
<text x="16.0" y="358.0" class="legend-label">obejscie i oskrzydlenie.</text>
</svg>
